name: CI/CD Application Build
on:
  repository_dispatch:
    types: [start-build]

permissions:
  contents: read

jobs:
  build-application:
    runs-on: ubuntu-latest
    steps:
      - name: Load config
        run: |
          echo "BRANCH=${{ github.event.client_payload.branch || 'main' }}" >> $GITHUB_ENV
          echo "ARTIFACT_PATH=${{ github.event.client_payload.artifact_path || 'dist' }}" >> $GITHUB_ENV
          echo "RETAIN_COUNT=${{ github.event.client_payload.retain_count || '5' }}" >> $GITHUB_ENV
          echo "CREATE_RELEASE_INPUT=${{ github.event.client_payload.create_release }}" >> $GITHUB_ENV
          echo "BUILD_TYPE=${{ github.event.client_payload.build_type || 'custom' }}" >> $GITHUB_ENV
          
          # Dynamic toolchain versions from payload (with secure defaults)
          echo "NODE_VERSION=${{ github.event.client_payload.node_version || '20' }}" >> $GITHUB_ENV
          echo "JAVA_VERSION=${{ github.event.client_payload.java_version || '17' }}" >> $GITHUB_ENV
          echo "JAVA_DISTRO=${{ github.event.client_payload.java_distro || 'temurin' }}" >> $GITHUB_ENV
          echo "NDK_VERSION=${{ github.event.client_payload.ndk_version || 'r26d' }}" >> $GITHUB_ENV

      # --- CONDITIONAL TOOLCHAINS ---
      - name: Setup Node.js
        if: env.BUILD_TYPE == 'node' || env.BUILD_TYPE == 'nextjs'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java/Android
        if: env.BUILD_TYPE == 'android-gradle'
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
          
      - name: Setup NDK
        if: env.BUILD_TYPE == 'ndk-cmake'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Fetch source (quiet)
        env:
          TOKEN: ${{ secrets.MAIN_ACCOUNT_PAT }}
          SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
        run: |
          set +x
          echo "::add-mask::$TOKEN"
          if [ -z "$SOURCE_REPO" ]; then
            echo "Error: SOURCE_REPO is not defined."
            exit 1
          fi
          git clone --quiet --depth 1 --branch "$BRANCH" \
            "https://x-access-token:${TOKEN}@github.com/${SOURCE_REPO}.git" src 2>/dev/null

      # --- CACHING ---
      - name: Cache Gradle (Android)
        if: env.BUILD_TYPE == 'android-gradle'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ github.event.client_payload.source_repo }}-${{ hashFiles('src/**/*.gradle*', 'src/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ github.event.client_payload.source_repo }}-

      - name: Cache Node Modules
        if: env.BUILD_TYPE == 'node' || env.BUILD_TYPE == 'nextjs'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ github.event.client_payload.source_repo }}-${{ hashFiles('src/**/package-lock.json', 'src/**/yarn.lock', 'src/**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ github.event.client_payload.source_repo }}-

      - name: Verify Prerequisite
        run: |
          if [ ! -f "src/build.sh" ]; then
            echo "Error: build.sh is missing in the repository root"
            exit 1
          fi

      - name: Execute build (build.sh has full control)
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          cd src
          chmod +x ./build.sh
          ./build.sh > ../build_logs.txt 2>&1
          cd ..
          if [ -f src/build_manifest.env ]; then
            cat src/build_manifest.env >> $GITHUB_ENV
          fi

      - name: Create release (skippable by build.sh)
        if: env.CREATE_RELEASE_INPUT != 'false' && env.SKIP_RELEASE != 'true'
        env:
          VAULT_PAT: ${{ secrets.VAULT_PAT }}
        run: |
          set +x
          echo "::add-mask::$VAULT_PAT"
          
          sudo apt-get install -y pigz > /dev/null 2>&1

          TAG_NAME="build-$(date +'%Y%m%d-%H%M%S')"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

          TARGET="${ARTIFACT_PATH:-dist}"
          if [ -d "src/$TARGET" ]; then
            tar -I pigz -cf release-artifacts.tar.gz -C src "$TARGET"
            UPLOAD_FILE="release-artifacts.tar.gz"
          else
            UPLOAD_FILE="src/$TARGET"
          fi

          RELEASE_RESPONSE=$(curl -s -X POST \
            -H "Authorization: token $VAULT_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/liebertjohan-art/artifacts/releases \
            -d "{\"tag_name\":\"$TAG_NAME\",\"name\":\"Build $TAG_NAME\"}")

          UPLOAD_URL=$(echo "$RELEASE_RESPONSE" | jq -r '.upload_url' | sed 's/{.*//')

          if [ -z "$UPLOAD_URL" ] || [ "$UPLOAD_URL" = "null" ]; then
            echo "Release creation failed"
            exit 1
          fi

          MIME_TYPE="application/gzip"
          if [[ "$UPLOAD_FILE" != *.tar.gz ]]; then
            MIME_TYPE="application/octet-stream"
          fi

          curl -s -X POST \
            -H "Authorization: token $VAULT_PAT" \
            -H "Content-Type: $MIME_TYPE" \
            --data-binary @"$UPLOAD_FILE" \
            "$UPLOAD_URL?name=$(basename $UPLOAD_FILE)" > /dev/null

          curl -s -X POST \
            -H "Authorization: token $VAULT_PAT" \
            -H "Content-Type: text/plain" \
            --data-binary @build_logs.txt \
            "$UPLOAD_URL?name=build_logs.txt" > /dev/null

      - name: Cleanup old releases
        if: env.CREATE_RELEASE_INPUT != 'false' && env.SKIP_RELEASE != 'true'
        env:
          VAULT_PAT: ${{ secrets.VAULT_PAT }}
        run: |
          set +x
          echo "::add-mask::$VAULT_PAT"

          RELEASES=$(curl -s -H "Authorization: token $VAULT_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/liebertjohan-art/artifacts/releases")

          echo "$RELEASES" | jq -r ".[${RETAIN_COUNT}:] | .[] | \"\(.id) \(.tag_name)\"" | while read -r id tag; do
            [ -z "$id" ] && continue
            curl -s -X DELETE \
              -H "Authorization: token $VAULT_PAT" \
              "https://api.github.com/repos/liebertjohan-art/artifacts/releases/$id" > /dev/null
            curl -s -X DELETE \
              -H "Authorization: token $VAULT_PAT" \
              "https://api.github.com/repos/liebertjohan-art/artifacts/git/refs/tags/$tag" > /dev/null
          done

      - name: Notify worker
        if: always()
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_AUTH: ${{ secrets.WORKER_AUTH }}
        run: |
          set +x
          echo "::add-mask::$WORKER_AUTH"

          STATUS="${{ job.status }}"
          TAG="${TAG_NAME:-failed-build}"

          curl -s -X POST "$WORKER_URL/notify" \
            -H "Content-Type: application/json" \
            -H "X-Secret-Auth: $WORKER_AUTH" \
            -d "{\"status\": \"$STATUS\", \"tag\": \"$TAG\"}" > /dev/null
